name: Release (Linux)

# 릴리스를 게시하면 amd64·arm64 용 .deb 와 .tar.gz 를 만들어 그 릴리스에 올린다.
# 이미 게시된 릴리스에 다시 올리려면 Actions 탭에서 태그를 넣어 수동 실행한다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 패키지를 올릴 릴리스 태그(예 v1.10.0)
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check version matches tag
        run: |
          VERSION="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' linux/Sources/Sizer/BuildInfo.swift)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "BuildInfo.version($VERSION) 이 태그($TAG)와 다릅니다." >&2
            exit 1
          fi

      - name: Test & package
        run: ./scripts/build_linux.sh --docker

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb dist/*.tar.gz --clobber
