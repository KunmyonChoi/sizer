name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # macos-15는 Xcode 16을 기본 제공(생성되는 pbxproj 포맷과 호환).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: >
          xcodebuild
          -project Sizer.xcodeproj
          -scheme Sizer
          -destination 'platform=macOS'
          test

  linux:
    # Linux 판: linux/Dockerfile(Ubuntu 24.04 + Swift 6.1 + ffmpeg)에서 공유 엔진·Linux 계층 테스트 → .deb/.tar.gz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test & package
        run: ./scripts/build_linux.sh --docker

      - uses: actions/upload-artifact@v4
        with:
          name: sizer-linux-amd64
          path: dist/*
